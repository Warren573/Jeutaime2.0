<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .wave { fill: none; stroke: #1e88e5; stroke-width: 2; }
      .bottle { fill: #90caf9; opacity: 0.8; }
    </style>
  </defs>

  <!-- Bottle shape -->
  <ellipse cx="100" cy="80" rx="20" ry="25" class="bottle"/>
  <rect x="85" y="50" width="30" height="20" class="bottle"/>
  <path d="M 85 50 Q 80 40 90 35 Q 100 30 110 35 Q 120 40 115 50" class="bottle"/>

  <!-- Water inside bottle -->
  <ellipse cx="100" cy="95" rx="18" ry="15" fill="#64b5f6"/>
  <path d="M 82 90 Q 85 85 100 85 Q 115 85 118 90" fill="#42a5f5"/>

  <!-- Wave lines -->
  <path d="M 50 140 Q 60 130 70 140 T 90 140 T 110 140 T 130 140 T 150 140" class="wave"/>
  <path d="M 40 160 Q 50 150 60 160 T 80 160 T 100 160 T 120 160 T 140 160 T 160 160" class="wave"/>
  <path d="M 45 175 Q 55 165 65 175 T 85 175 T 105 175 T 125 175 T 145 175 T 165 175" class="wave"/>
</svg>
