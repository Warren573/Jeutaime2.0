name: Match Breaking E2E Test

on:
  workflow_dispatch:

jobs:
  test-match-breaking:
    runs-on: ubuntu-latest
    steps:
      - name: Test match breaking and effects
        run: |
          set -e

          API_URL="https://jeutaime-staging.onrender.com/api"
          echo "=== Match Breaking E2E Test ==="
          echo "API_URL: $API_URL"
          echo ""

          # Version Check
          echo "=== Version Check: Verify deployed commit ==="
          VERSION=$(curl -s "$API_URL/test/version")
          echo "Deployed version:"
          echo "$VERSION" | jq .
          DEPLOYED_COMMIT=$(echo "$VERSION" | jq -r '.commit')
          ENVIRONMENT=$(echo "$VERSION" | jq -r '.environment')
          echo "Environment: $ENVIRONMENT"
          echo "Deployed commit: $DEPLOYED_COMMIT"
          echo ""

          # Step 0: Cleanup staging data
          echo "=== Step 0: Cleanup staging debug data ==="
          CLEANUP=$(curl -s -X POST "$API_URL/test/cleanup-staging-debug-data" \
            -H "Content-Type: application/json")
          echo "Cleanup response:"
          echo "$CLEANUP" | jq .
          echo ""

          # Step 1: Reset mutual smile
          echo "=== Step 1: Reset mutual smile ==="
          RESET=$(curl -s -X POST "$API_URL/test/reset-mutual-smile" \
            -H "Content-Type: application/json")
          echo "Response:"
          echo "$RESET" | jq .
          echo ""

          EMAIL_A=$(echo "$RESET" | jq -r '.accountA.email')
          PASSWORD_A=$(echo "$RESET" | jq -r '.accountA.password')
          USER_ID_A=$(echo "$RESET" | jq -r '.accountA.userId')

          EMAIL_B=$(echo "$RESET" | jq -r '.accountB.email')
          PASSWORD_B=$(echo "$RESET" | jq -r '.accountB.password')
          USER_ID_B=$(echo "$RESET" | jq -r '.accountB.userId')

          echo "Account A: $EMAIL_A (userId: $USER_ID_A)"
          echo "Account B: $EMAIL_B (userId: $USER_ID_B)"
          echo ""

          # Step 2: Login A
          echo "=== Step 2: Login A ==="
          LOGIN_A=$(curl -s -X POST "$API_URL/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$EMAIL_A\",\"password\":\"$PASSWORD_A\"}")

          TOKEN_A=$(echo "$LOGIN_A" | jq -r '.data.accessToken // .accessToken // empty')
          if [ -z "$TOKEN_A" ] || [ "$TOKEN_A" = "null" ]; then
            echo "ERROR: Failed to get token for A"
            exit 1
          fi
          echo "✅ Token A acquired"
          echo ""

          # Step 3: Login B
          echo "=== Step 3: Login B ==="
          LOGIN_B=$(curl -s -X POST "$API_URL/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$EMAIL_B\",\"password\":\"$PASSWORD_B\"}")

          TOKEN_B=$(echo "$LOGIN_B" | jq -r '.data.accessToken // .accessToken // empty')
          if [ -z "$TOKEN_B" ] || [ "$TOKEN_B" = "null" ]; then
            echo "ERROR: Failed to get token for B"
            exit 1
          fi
          echo "✅ Token B acquired"
          echo ""

          # Step 4: Mutual smile
          echo "=== Step 4: A smiles at B ==="
          SMILE_A=$(curl -s -X POST "$API_URL/discover/react" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN_A" \
            -d "{\"toId\":\"$USER_ID_B\",\"type\":\"SMILE\"}")

          echo "=== Step 5: B smiles at A (mutual) ==="
          SMILE_B=$(curl -s -X POST "$API_URL/discover/react" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN_B" \
            -d "{\"toId\":\"$USER_ID_A\",\"type\":\"SMILE\"}")

          MATCH_ID=$(echo "$SMILE_B" | jq -r '.data.matchId // .matchId // empty')
          if [ -z "$MATCH_ID" ] || [ "$MATCH_ID" = "null" ]; then
            echo "ERROR: Match ID missing after mutual smile"
            exit 1
          fi

          echo "✅ Match created: $MATCH_ID"
          echo ""

          # Step 6: A accepts the match
          echo "=== Step 6: A accepts the match ==="
          ACCEPT=$(curl -s -X POST "$API_URL/matches/$MATCH_ID/accept" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN_A")
          echo "✅ Match accepted"
          echo ""

          # Step 7: A submits question answers
          echo "=== Step 7: A & B validate questions ==="
          QUESTIONS_A=$(curl -s "$API_URL/test/match-questions?matchId=$MATCH_ID")
          ANSWERS_A=$(echo "$QUESTIONS_A" | jq -c '[.userB.questions[]? | {profileQuestionId: .profileQuestionId, answer: .answer}]')

          curl -s -X POST "$API_URL/matches/$MATCH_ID/questions/answers" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN_A" \
            -d "{\"answers\": $ANSWERS_A}" > /dev/null

          QUESTIONS_B=$(curl -s "$API_URL/test/match-questions?matchId=$MATCH_ID")
          ANSWERS_B=$(echo "$QUESTIONS_B" | jq -c '[.userA.questions[]? | {profileQuestionId: .profileQuestionId, answer: .answer}]')

          curl -s -X POST "$API_URL/matches/$MATCH_ID/questions/answers" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN_B" \
            -d "{\"answers\": $ANSWERS_B}" > /dev/null

          echo "✅ Questions validated"
          echo ""

          # Step 8: Send at least 1 letter
          echo "=== Step 8: Exchange at least 1 letter ==="
          LETTER_1=$(curl -s -X POST "$API_URL/matches/$MATCH_ID/letters" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN_A" \
            -d "{\"content\":\"First message from A before breaking match\"}")

          LETTER_1_ID=$(echo "$LETTER_1" | jq -r '.data.id // empty')
          if [ -z "$LETTER_1_ID" ] || [ "$LETTER_1_ID" = "null" ]; then
            echo "ERROR: A should be able to send letter before breaking"
            exit 1
          fi

          echo "✅ Letter sent: $LETTER_1_ID"
          echo ""

          # ============================================================
          # MATCH BREAKING TESTS
          # ============================================================

          echo "=== MATCH BREAKING TESTS ==="
          echo ""

          # Step 9: Verify match state BEFORE breaking
          echo "=== Step 9: Verify match state BEFORE breaking ==="
          MATCH_BEFORE=$(curl -s "$API_URL/matches/$MATCH_ID" \
            -H "Authorization: Bearer $TOKEN_A")

          STATUS_BEFORE=$(echo "$MATCH_BEFORE" | jq -r '.data.status')
          CURRENT_SIDE=$(echo "$MATCH_BEFORE" | jq -r '.data.currentUserSide')
          LAST_LETTER_BY=$(echo "$MATCH_BEFORE" | jq -r '.data.lastLetterBy')
          LETTER_COUNT_A=$(echo "$MATCH_BEFORE" | jq -r '.data.letterCountA')
          LETTER_COUNT_B=$(echo "$MATCH_BEFORE" | jq -r '.data.letterCountB')
          CAN_SEND_BEFORE=$(echo "$MATCH_BEFORE" | jq -r '.data.canSend')
          CAN_SEND_REASON=$(echo "$MATCH_BEFORE" | jq -r '.data.canSendReason // .data.reason // "N/A"')

          echo "Before breaking (viewed as $CURRENT_SIDE):"
          echo "  match.status: $STATUS_BEFORE (expected: ACTIVE)"
          echo "  currentUserSide: $CURRENT_SIDE"
          echo "  lastLetterBy: $LAST_LETTER_BY"
          echo "  letterCountA: $LETTER_COUNT_A"
          echo "  letterCountB: $LETTER_COUNT_B"
          echo "  canSend: $CAN_SEND_BEFORE"
          echo "  canSendReason: $CAN_SEND_REASON (Note: false if not their turn)"

          if [ "$STATUS_BEFORE" != "ACTIVE" ]; then
            echo "  ❌ ERROR: Status should be ACTIVE, got $STATUS_BEFORE"
            exit 1
          fi

          echo "  ✅ Match is ACTIVE (ready to break)"
          echo ""

          # Step 10: A breaks the match
          echo "=== Step 10: A breaks the match (DELETE /api/matches/:id) ==="
          BREAK_RESPONSE=$(curl -s -X DELETE "$API_URL/matches/$MATCH_ID" \
            -H "Authorization: Bearer $TOKEN_A")

          echo "Break response:"
          echo "$BREAK_RESPONSE" | jq .

          STATUS_AFTER_BREAK=$(echo "$BREAK_RESPONSE" | jq -r '.data.status // .status // empty')
          if [ -z "$STATUS_AFTER_BREAK" ]; then
            echo "ERROR: No status in break response"
            echo "$BREAK_RESPONSE" | jq .
            exit 1
          fi

          echo "Status after break: $STATUS_AFTER_BREAK"
          echo ""

          if [ "$STATUS_AFTER_BREAK" != "BROKEN" ]; then
            echo "❌ ERROR: Status should be BROKEN, got $STATUS_AFTER_BREAK"
            exit 1
          fi

          echo "✅ Match successfully broken"
          echo ""

          # Step 11: Verify match state AFTER breaking
          echo "=== Step 11: Verify match state AFTER breaking ==="
          MATCH_AFTER=$(curl -s "$API_URL/matches/$MATCH_ID" \
            -H "Authorization: Bearer $TOKEN_A")

          STATUS_AFTER=$(echo "$MATCH_AFTER" | jq -r '.data.status')
          CURRENT_SIDE_AFTER=$(echo "$MATCH_AFTER" | jq -r '.data.currentUserSide')
          LAST_LETTER_BY_AFTER=$(echo "$MATCH_AFTER" | jq -r '.data.lastLetterBy')
          LETTER_COUNT_A_AFTER=$(echo "$MATCH_AFTER" | jq -r '.data.letterCountA')
          LETTER_COUNT_B_AFTER=$(echo "$MATCH_AFTER" | jq -r '.data.letterCountB')
          CAN_SEND_AFTER=$(echo "$MATCH_AFTER" | jq -r '.data.canSend')
          CAN_SEND_REASON_AFTER=$(echo "$MATCH_AFTER" | jq -r '.data.canSendReason // .data.reason // "N/A"')

          echo "After breaking (viewed as $CURRENT_SIDE_AFTER):"
          echo "  match.status: $STATUS_AFTER (expected: BROKEN)"
          echo "  currentUserSide: $CURRENT_SIDE_AFTER"
          echo "  lastLetterBy: $LAST_LETTER_BY_AFTER"
          echo "  letterCountA: $LETTER_COUNT_A_AFTER"
          echo "  letterCountB: $LETTER_COUNT_B_AFTER"
          echo "  canSend: $CAN_SEND_AFTER (expected: false, reason: MATCH_NOT_ACTIVE)"
          echo "  canSendReason: $CAN_SEND_REASON_AFTER"

          if [ "$STATUS_AFTER" != "BROKEN" ]; then
            echo "  ❌ ERROR: Status should remain BROKEN, got $STATUS_AFTER"
            exit 1
          fi

          if [ "$CAN_SEND_AFTER" != "false" ]; then
            echo "  ❌ ERROR: canSend should be false after breaking, got $CAN_SEND_AFTER"
            exit 1
          fi

          echo "  ✅ Match is BROKEN (status persisted, canSend=false)"
          echo ""

          # Step 12: A tries to send letter after breaking (SHOULD FAIL)
          echo "=== Step 12: A tries to send letter after breaking (SHOULD FAIL) ==="
          LETTER_AFTER_BREAK=$(curl -s -X POST "$API_URL/matches/$MATCH_ID/letters" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN_A" \
            -d "{\"content\":\"A tries to send after breaking\"}")

          echo "Response:"
          echo "$LETTER_AFTER_BREAK" | jq .

          LETTER_ERROR=$(echo "$LETTER_AFTER_BREAK" | jq -r '.error // empty')
          LETTER_ID=$(echo "$LETTER_AFTER_BREAK" | jq -r '.data.id // empty')

          if [ -n "$LETTER_ID" ] && [ "$LETTER_ID" != "null" ]; then
            echo "❌ ERROR: A should NOT be able to send letter after breaking"
            echo "Got letter ID: $LETTER_ID"
            exit 1
          fi

          if [ -z "$LETTER_ERROR" ]; then
            echo "❌ ERROR: Expected error response when sending letter after break"
            echo "Response: $(echo "$LETTER_AFTER_BREAK" | jq .)"
            exit 1
          fi

          echo "✅ A correctly blocked from sending (error: $LETTER_ERROR)"
          echo ""

          # Step 13: B tries to send letter after breaking (SHOULD FAIL)
          echo "=== Step 13: B tries to send letter after breaking (SHOULD FAIL) ==="
          LETTER_B_AFTER=$(curl -s -X POST "$API_URL/matches/$MATCH_ID/letters" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN_B" \
            -d "{\"content\":\"B tries to send after breaking\"}")

          LETTER_B_ERROR=$(echo "$LETTER_B_AFTER" | jq -r '.error // empty')
          LETTER_B_ID=$(echo "$LETTER_B_AFTER" | jq -r '.data.id // empty')

          if [ -n "$LETTER_B_ID" ] && [ "$LETTER_B_ID" != "null" ]; then
            echo "❌ ERROR: B should NOT be able to send letter after breaking"
            exit 1
          fi

          echo "✅ B correctly blocked from sending"
          echo ""

          # Step 14: Verify letters are still readable (history preserved)
          echo "=== Step 14: Verify letters are still readable (history) ==="
          LETTERS_AFTER=$(curl -s "$API_URL/matches/$MATCH_ID/letters" \
            -H "Authorization: Bearer $TOKEN_A")

          LETTERS_COUNT=$(echo "$LETTERS_AFTER" | jq '.data | length')
          echo "Letters count after break: $LETTERS_COUNT (expected: >= 1)"

          if [ "$LETTERS_COUNT" -lt 1 ]; then
            echo "⚠️  WARNING: Expected at least 1 letter in history"
          else
            echo "✅ Letters still accessible as read-only history"
          fi

          echo ""

          # Step 15: Discovery - Verify profile NOT visible after breaking
          echo "=== Step 15: Discovery after breaking (profiles remain excluded) ==="
          DISCOVERY_AFTER=$(curl -s "$API_URL/profiles?pageSize=50" \
            -H "Authorization: Bearer $TOKEN_A")

          DISCOVERY_COUNT=$(echo "$DISCOVERY_AFTER" | jq '.data | length')
          DISCOVERY_HAS_B=$(echo "$DISCOVERY_AFTER" | jq ".data[] | select(.userId == \"$USER_ID_B\") | .userId" | grep -q "$USER_ID_B" && echo "true" || echo "false")

          echo "Discovery after breaking:"
          echo "  Profile count: $DISCOVERY_COUNT"
          echo "  B is in list: $DISCOVERY_HAS_B (expected: false - stays excluded)"

          if [ "$DISCOVERY_HAS_B" = "true" ]; then
            echo "  ⚠️  B reappeared in discovery (check if policy changed)"
          else
            echo "  ✅ B correctly remains excluded (BROKEN status in filter)"
          fi

          echo ""

          # Final summary
          echo "=== ✅ SUCCESS: MATCH BREAKING SYSTEM WORKING ==="
          echo "Test Results:"
          echo "  ✅ Match created and accepted (status=ACTIVE)"
          echo "  ✅ Letters exchanged before breaking"
          echo "  ✅ DELETE /api/matches/:id breaks match (status→BROKEN)"
          echo "  ✅ A blocked from sending after breaking"
          echo "  ✅ B blocked from sending after breaking"
          echo "  ✅ Letters remain readable as history"
          echo "  ✅ Profiles remain excluded from discovery"
          echo ""
          echo "Match breaking system validated ✓"
