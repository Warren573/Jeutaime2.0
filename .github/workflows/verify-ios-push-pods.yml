name: Verify iOS push CocoaPods (no deployment)

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/ios/**'
      - '.github/workflows/verify-ios-push-pods.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pods:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked JS dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Resolve native iOS dependencies
        working-directory: frontend/ios
        run: pod install --repo-update
      - name: Show resolved ExpoNotifications pod version
        working-directory: frontend
        run: grep 'ExpoNotifications (' ios/Podfile.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-sdk54-podfile-lock
          path: frontend/ios/Podfile.lock
          retention-days: 7
      - name: Verify ExpoNotifications matches SDK 54
        working-directory: frontend
        run: |
          grep -E '^  - ExpoNotifications \(0\.32\.17\):' ios/Podfile.lock
          grep -A2 '<key>aps-environment</key>' ios/JeuTaime/JeuTaime.entitlements | grep production
