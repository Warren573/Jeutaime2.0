name: Verify iOS push CocoaPods (no deployment)

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/ios/**'
      - '.github/workflows/verify-ios-push-pods.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pods:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked JS dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Resolve native iOS dependencies
        working-directory: frontend/ios
        run: pod install --repo-update
      - name: Show resolved EXNotifications pod version
        working-directory: frontend
        run: grep 'EXNotifications (' ios/Podfile.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-sdk54-podfile-lock
          path: frontend/ios/Podfile.lock
          retention-days: 7
      - name: Verify EXNotifications matches SDK 54
        working-directory: frontend
        run: |
          grep -E '^  - EXNotifications \(0\.32\.17\):' ios/Podfile.lock
          grep -A2 '<key>aps-environment</key>' ios/JeuTaime/JeuTaime.entitlements | grep production
      - name: Commit resolved Podfile.lock on the PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: frontend/ios
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if ! git diff --quiet -- Podfile.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Podfile.lock
            git commit -m "fix(ios): lock Expo SDK 54 native notification pods"
            git push origin "HEAD:$HEAD_REF"
          fi
