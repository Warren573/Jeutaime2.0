name: Validate Economy Lot 1

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/src/config/constants.ts'
      - 'backend/tests/unit/dailyBonus.test.ts'
      - '.github/workflows/economy-lot-1.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Validate Prisma and generate client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/unused
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/unused
        run: |
          npx prisma validate
          npx prisma generate
      - name: Test daily bonus
        working-directory: backend
        run: npm test -- dailyBonus.test.ts
      - name: Typecheck backend
        working-directory: backend
        run: npm run typecheck
