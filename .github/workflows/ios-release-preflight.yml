name: iOS release preflight (read-only, no build, no publication)

# Contrôle de la configuration iOS d'une version AVANT de lancer le build TestFlight.
# - Lecture seule : aucun secret, aucun appel à EAS, aucun build, aucune OTA, aucune soumission, aucune base de données.
# - Vérifie que version, runtime, Info.plist, Expo.plist, eas.json et le workflow d'OTA sont cohérents
#   (voir frontend/scripts/check-ios-release-config.js), puis que la configuration Expo se résout correctement.
# - Se lance aussi automatiquement sur les pull requests qui touchent ces fichiers.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/app.json'
      - 'frontend/eas.json'
      - 'frontend/ios/JeuTaime/Info.plist'
      - 'frontend/ios/JeuTaime/Supporting/Expo.plist'
      - 'frontend/scripts/check-ios-release-config.js'
      - '.github/workflows/update-ios-internal.yml'
      - '.github/workflows/build-ios-testflight.yml'
      - '.github/workflows/submit-ios-testflight.yml'
      - '.github/workflows/ios-release-preflight.yml'

permissions:
  contents: read

env:
  EXPECTED_VERSION: '2.1.0'

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check iOS release configuration
        run: node scripts/check-ios-release-config.js "$EXPECTED_VERSION"

      - name: Install locked dependencies (same command as the build workflow)
        run: npm ci --no-audit --no-fund

      - name: Resolve the Expo configuration
        run: |
          npx expo config --type public --json > "$RUNNER_TEMP/expo-config.json"
          node -e '
            const c = JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/expo-config.json", "utf8"));
            const exp = process.env.EXPECTED_VERSION;
            const rows = {
              version: c.version,
              "ios.runtimeVersion": c.ios && c.ios.runtimeVersion,
              "ios.bundleIdentifier": c.ios && c.ios.bundleIdentifier,
              "updates.url": c.updates && c.updates.url,
              "android.runtimeVersion (inchangé)": c.android && c.android.runtimeVersion,
            };
            console.log(JSON.stringify(rows, null, 2));
            if (c.version !== exp || !c.ios || c.ios.runtimeVersion !== exp) { console.error("Configuration Expo résolue incohérente avec " + exp); process.exit(1); }
          '
