name: Build and submit JeuTaime iOS to TestFlight

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Full 40-character SHA of the current main commit'
        required: true
        type: string
      confirm:
        description: 'Type BUILD_IOS_TESTFLIGHT to authorize build and submission'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jeutaime-ios-testflight-build
  cancel-in-progress: false

jobs:
  build-ios:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Validate explicit authorization
        working-directory: .
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "BUILD_IOS_TESTFLIGHT" ]; then
            echo "Explicit confirmation required" >&2
            exit 1
          fi
          if ! printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Expected a complete 40-character lowercase commit SHA" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Validate exact source commit
        working-directory: .
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "main changed: expected $EXPECTED_SHA, got $ACTUAL_SHA" >&2
            exit 1
          fi
          echo "Source commit: $ACTUAL_SHA" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Version, runtime, Info.plist, Expo.plist, EAS (build géré à distance, canal des OTA) et workflow d'OTA : tout doit être cohérent.
      - name: Check iOS 2.1.0 release configuration
        run: node scripts/check-ios-release-config.js 2.1.0

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Queue iOS production build and submit to TestFlight
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          eas build --platform ios --profile production --auto-submit --non-interactive --wait

      # Récapitulatif informatif : ne fait jamais échouer le job (le build et la soumission sont déjà terminés à ce stade).
      - name: Record the EAS build (version and build number)
        if: success()
        continue-on-error: true
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          eas build:list --platform ios --limit 1 --json --non-interactive > "$RUNNER_TEMP/last-build.json"
          node <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync(process.env.RUNNER_TEMP + '/last-build.json', 'utf8');
          const start = raw.search(/[\[{]/);
          const parsed = JSON.parse(raw.slice(start, Math.max(raw.lastIndexOf(']'), raw.lastIndexOf('}')) + 1));
          const b = Array.isArray(parsed) ? parsed[0] : parsed;
          const lines = [
            '### Build iOS compilé',
            '- Version : `' + b.appVersion + '`',
            '- Numéro de build : `' + b.appBuildVersion + '`',
            '- Identifiant EAS : `' + b.id + '`',
            '- Statut : `' + b.status + '`',
            '- Commit du build : `' + b.gitCommitHash + '`',
          ];
          if (b.appVersion !== '2.1.0') lines.push('- ⚠️ Version inattendue (attendu 2.1.0).');
          console.log(lines.join('\n'));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE

      - name: Record result
        if: success()
        run: |
          echo "iOS EAS build command completed. Verify the build number and Apple processing status in EAS and App Store Connect." >> "$GITHUB_STEP_SUMMARY"
