name: Build and submit JeuTaime iOS to TestFlight

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Full 40-character SHA of the current main commit'
        required: true
        type: string
      confirm:
        description: 'Type BUILD_IOS_TESTFLIGHT to authorize build and submission'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jeutaime-ios-testflight-build
  cancel-in-progress: false

jobs:
  build-ios:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Validate explicit authorization
        working-directory: .
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "BUILD_IOS_TESTFLIGHT" ]; then
            echo "Explicit confirmation required" >&2
            exit 1
          fi
          if ! printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Expected a complete 40-character lowercase commit SHA" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Validate exact source commit
        working-directory: .
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "main changed: expected $EXPECTED_SHA, got $ACTUAL_SHA" >&2
            exit 1
          fi
          echo "Source commit: $ACTUAL_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Check Expo build settings
        run: |
          node <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8')).expo;
          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          if (app.version !== '2.0.0' || app.ios?.runtimeVersion !== '2.0.0') throw Error('Unexpected iOS app/runtime version');
          if (app.ios?.bundleIdentifier !== 'com.jeutaime.app') throw Error('Unexpected bundle identifier');
          if (eas.build?.production?.channel !== 'internal-test' || eas.build?.production?.autoIncrement !== true) throw Error('Unexpected EAS production build profile');
          if (eas.cli?.appVersionSource !== 'remote') throw Error('EAS remote version management required');
          console.log('Expo iOS production configuration verified');
          NODE

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Queue iOS production build and submit to TestFlight
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          eas build --platform ios --profile production --auto-submit --non-interactive --wait

      - name: Record result
        if: success()
        run: |
          echo "iOS EAS build command completed. Verify the build number and Apple processing status in EAS and App Store Connect." >> "$GITHUB_STEP_SUMMARY"
