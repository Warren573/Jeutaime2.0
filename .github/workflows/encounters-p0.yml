name: Encounter P0 regression checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [audit/encounters-p0-20261013]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encounters-p0:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jeutaime_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jeutaime_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jeutaime_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/jeutaime_test
      JWT_ACCESS_SECRET: test_access_secret_minimum_32_characters_123
      JWT_REFRESH_SECRET: test_refresh_secret_minimum_32_characters_123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Encounter business rules
        run: npx vitest run tests/unit/encounters-p0.regression.test.ts tests/unit/encounters-smiles-p0.test.ts tests/unit/encounters-questions-p0.test.ts tests/unit/encounters-letters-p0.test.ts tests/unit/encounters-ghosting-p0.test.ts tests/unit/encounters-vacation-p0.test.ts
      - name: Initialize isolated PostgreSQL schema
        run: npx prisma db push --skip-generate
      - name: Initialize account deactivation auxiliary table (CI only)
        run: |
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260807143000_add_account_deactivation/migration.sql
      - name: Real PostgreSQL encounter integration
        run: npx vitest run tests/integration/encounters-p0-postgres.test.ts
      - name: Backend typecheck
        run: npm run typecheck
