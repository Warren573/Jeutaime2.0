name: Bottles Integration Tests (PostgreSQL)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/duel-validation-profiles-r85y7z
      - main
    paths:
      - 'backend/src/modules/bottles/**'
      - 'backend/tests/integration/bottles-*.test.ts'
      - 'backend/tests/unit/bottles*.test.ts'
      - 'backend/prisma/**'
      - 'backend/package.json'
      - '.github/workflows/bottles-integration-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/modules/bottles/**'
      - 'backend/tests/integration/bottles-*.test.ts'
      - 'backend/tests/unit/bottles*.test.ts'
      - 'backend/prisma/**'

jobs:
  bottles-integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jeutaime_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Prisma validate schema
        working-directory: backend
        run: npx prisma validate

      - name: Prisma generate client
        working-directory: backend
        run: npx prisma generate

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 1
          done
        env:
          PGPASSWORD: postgres

      - name: Run Prisma migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jeutaime_test
        run: npx prisma migrate deploy

      - name: Verify database connection
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d jeutaime_test -c \
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public';"

      - name: Run unit tests (bottles)
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jeutaime_test
          JWT_ACCESS_SECRET: test_access_secret_32chars_minimum_1
          JWT_REFRESH_SECRET: test_refresh_secret_32chars_minimum_1
        run: npm test -- bottles.service.test bottles-get-current.test bottles-turn-by-turn.test bottles.e2e.test

      - name: Run integration tests (bottles concurrency)
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jeutaime_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jeutaime_test
          JWT_ACCESS_SECRET: test_access_secret_32chars_minimum_1
          JWT_REFRESH_SECRET: test_refresh_secret_32chars_minimum_1
        run: npm test -- bottles-concurrency

      - name: TypeScript build check
        working-directory: backend
        run: npm run typecheck

      - name: ESLint check (bottles module)
        working-directory: backend
        run: npm run lint -- src/modules/bottles/

      - name: Database integrity check
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d jeutaime_test -c \
            "SELECT
              (SELECT COUNT(*) FROM \"MessageInABottle\") as bottles_count,
              (SELECT COUNT(*) FROM \"AnonymousMessage\") as messages_count,
              (SELECT COUNT(DISTINCT \"bottleId\") FROM \"AnonymousMessage\") as bottles_with_messages,
              (SELECT COUNT(*) FROM (
                SELECT \"senderId\", \"idempotencyKey\"
                FROM \"AnonymousMessage\"
                WHERE \"idempotencyKey\" IS NOT NULL
                GROUP BY \"senderId\", \"idempotencyKey\"
                HAVING COUNT(*) > 1
              ) duplicates) as duplicate_idempotency_keys;"

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Bottles Test Results
          path: 'backend/test-results.json'
          reporter: 'java-junit'
          fail-on-error: false
