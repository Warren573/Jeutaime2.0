name: Publish JeuTaime Android OTA (internal testers)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Validated Android QA branch to publish'
        required: true
        default: 'ota-settings-a16-20261030'
        type: string

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Restrict publication to validated Android QA branch
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if [ "$SOURCE_REF" != 'ota-settings-a16-20261030' ]; then
            echo 'Only the reviewed Android OTA test branch is allowed.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Publish JS and assets to internal-test only
        run: eas update --branch internal-test --message "Manual internal QA update" --non-interactive
