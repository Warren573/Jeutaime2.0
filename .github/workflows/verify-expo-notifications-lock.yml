name: Verify Expo notifications dependency lock
on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/verify-expo-notifications-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lockfile using npm registry
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Check Expo SDK 54 compatibility and lock
        working-directory: frontend
        run: |
          node - <<'NODE'
          const p = require('./package.json');
          const lock = require('./package-lock.json');
          if (p.dependencies['expo-notifications'] !== '~0.32.17') throw Error('Incorrect expo-notifications range');
          if (lock.packages[''].dependencies['expo-notifications'] !== '~0.32.17') throw Error('Incorrect lock root range');
          if (lock.packages['node_modules/expo-notifications']?.version !== '0.32.17') throw Error('Incorrect installed version');
          NODE
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lockfile on the PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: frontend
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix(expo): lock SDK 54 notification dependencies"
            git push origin "HEAD:$HEAD_REF"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: expo-sdk54-package-lock
          path: frontend/package-lock.json
          retention-days: 7
