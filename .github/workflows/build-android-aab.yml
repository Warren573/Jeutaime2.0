name: Build Android AAB (JeuTaime)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-android-aab.yml'

permissions:
  contents: read

jobs:
  build:
    name: EAS Android production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Expo configuration and required assets
        run: |
          test -f assets/icon.png
          node -e "const c=require('./app.json').expo; if (!c.extra?.eas?.projectId || !c.updates?.url || c.orientation !== 'portrait') process.exit(1)"
          npx expo config --type public --json > /tmp/jeutaime-expo-config.json
      - name: Request signed Android App Bundle from EAS
        run: eas build --platform android --profile production --non-interactive --wait
