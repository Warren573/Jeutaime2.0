name: Backend CI
on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
permissions:
  contents: read
jobs:
  backend:
    name: Backend tests and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/jeutaime_ci
          DIRECT_URL: postgresql://test:test@localhost:5432/jeutaime_ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  postgres-concurrency:
    name: PostgreSQL wallet concurrency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: jeutaime_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d jeutaime_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@localhost:5432/jeutaime_ci
      DIRECT_URL: postgresql://test:test@localhost:5432/jeutaime_ci
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/jeutaime_ci
      JWT_ACCESS_SECRET: ci_access_secret_0123456789_0123456789
      JWT_REFRESH_SECRET: ci_refresh_secret_0123456789_0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Prepare isolated test schema
        # The historical migrations assume an existing baseline; this is a disposable CI DB only.
        run: npx prisma db push --skip-generate
      - name: Test wallet concurrency
        run: npx vitest run tests/integration/card-game-wallet-concurrency.test.ts tests/integration/economy-wallet-integrity.test.ts --reporter=default
