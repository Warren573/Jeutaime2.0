name: Mobile store preflight
on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/mobile-store-preflight.yml"
permissions:
  contents: write
jobs:
  expo-preflight:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate dependency lockfile for verification
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify reproducible installation
        run: npm ci --no-audit --no-fund
      - name: Commit repaired dependency lock to beta branch
        if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/store-beta-readiness'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'fix: synchronize frontend package-lock for clean installs'
            git push origin HEAD:release/store-beta-readiness
          fi
      - name: Upload corrected lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: frontend-package-lock-corrected
          path: frontend/package-lock.json
          retention-days: 7
      - name: Validate Expo configuration
        run: npx expo config --type public --json > /dev/null
      - name: Validate store-test build profiles
        run: |
          node -e 'const e=require("./eas.json"); if(e.build["store-test"]?.distribution!=="store"||e.build["store-test"]?.android?.buildType!=="app-bundle"||e.submit["store-test"]?.android?.track!=="internal") process.exit(1)'
      - name: Export iOS JavaScript bundle
        run: npx expo export --platform ios --output-dir /tmp/jeutaime-ios-export
      - name: Export Android JavaScript bundle
        run: npx expo export --platform android --output-dir /tmp/jeutaime-android-export
