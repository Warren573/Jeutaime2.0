name: Store readiness backend checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/src/modules/premium/**'
      - 'frontend/app/premium.tsx'
      - 'frontend/src/api/premium.ts'
      - '.github/workflows/store-readiness-check.yml'

permissions:
  contents: read

jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Generate Prisma and compile backend
        working-directory: backend
        run: npm run build
