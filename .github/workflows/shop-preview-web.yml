name: Verify new boutique web export
on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/screens/ShopScreen.tsx'
      - '.github/workflows/shop-preview-web.yml'
permissions:
  contents: read
jobs:
  shop-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies without modifying tracked lockfile
        working-directory: frontend
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Compile production web storefront
        working-directory: frontend
        env:
          CI: '1'
        run: npx expo export --platform web
