name: Payment catalog contract
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/src/policies/paidProducts.ts'
      - 'backend/tests/unit/paid-products.test.ts'
      - '.github/workflows/payment-catalog-contract.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend
        working-directory: backend
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Test catalog
        working-directory: backend
        run: npx vitest run tests/unit/paid-products.test.ts
