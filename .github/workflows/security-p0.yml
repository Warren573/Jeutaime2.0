name: Security P0 checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [audit/security-p0-test-routes-20261013]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-p0:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jeutaime_test
      JWT_ACCESS_SECRET: test_access_secret_minimum_32_characters_123
      JWT_REFRESH_SECRET: test_refresh_secret_minimum_32_characters_123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Test production-route and role protections
        run: npx vitest run tests/unit/production-routes.security.test.ts tests/unit/roles.security.test.ts
      - name: Backend typecheck
        run: npm run typecheck
