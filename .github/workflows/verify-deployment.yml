name: Verify Deployment

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
          echo "Deploy triggered, waiting for Render..."
          sleep 10

      - name: Wait for Render to be READY
        run: |
          echo "Polling Render health endpoint..."
          for i in {1..30}; do
            RESPONSE=$(curl -s https://jeutaime-staging.onrender.com/api/health/version)
            echo "Attempt $i: $RESPONSE"
            if echo "$RESPONSE" | grep -q '"sha"'; then
              echo "✅ Render is responding"
              echo "HEALTH_RESPONSE=$RESPONSE" >> $GITHUB_ENV
              break
            fi
            sleep 10
          done

      - name: Extract and verify SHA
        run: |
          LATEST_SHA=$(git rev-parse --short HEAD)
          echo "Expected SHA (short): $LATEST_SHA"
          echo "Health response: ${{ env.HEALTH_RESPONSE }}"

          # Extract SHA from response (first 8 chars)
          RENDER_SHA=$(echo '${{ env.HEALTH_RESPONSE }}' | grep -o '"sha":"[^"]*' | cut -d'"' -f4 | cut -c1-8)
          echo "Render SHA (short): $RENDER_SHA"

          if [ "$RENDER_SHA" = "$LATEST_SHA" ]; then
            echo "✅ SHA matches!"
            echo "SHA_OK=true" >> $GITHUB_ENV
          else
            echo "⚠️ SHA mismatch (may be OK if deploy is slow)"
            echo "SHA_OK=false" >> $GITHUB_ENV
          fi

      - name: Test /api/test/reset-mutual-smile
        run: |
          echo "Testing reset-mutual-smile endpoint..."
          RESPONSE=$(curl -s -X POST https://jeutaime-staging.onrender.com/api/test/reset-mutual-smile)
          echo "Response: $RESPONSE"

          if echo "$RESPONSE" | grep -q '"status":"success"'; then
            echo "✅ Endpoint returned 200 with success"
            echo "ENDPOINT_OK=true" >> $GITHUB_ENV
          elif echo "$RESPONSE" | grep -q '"status":"test-router-mounted"'; then
            echo "⚠️ Got health response instead"
            echo "ENDPOINT_OK=false" >> $GITHUB_ENV
          elif echo "$RESPONSE" | grep -q 'NOT_FOUND\|Route introuvable'; then
            echo "❌ Endpoint returned 404"
            echo "ENDPOINT_OK=false" >> $GITHUB_ENV
          elif echo "$RESPONSE" | grep -q 'Test endpoint disabled'; then
            echo "❌ Endpoint disabled (NODE_ENV=production)"
            echo "ENDPOINT_OK=false" >> $GITHUB_ENV
          else
            echo "❌ Unexpected response"
            echo "ENDPOINT_OK=false" >> $GITHUB_ENV
          fi

      - name: Final Result
        run: |
          echo ""
          echo "========== DEPLOYMENT VERIFICATION =========="
          echo "✅ Render deploy triggered"
          echo "✅ Render responding to /api/health/version"
          if [ "${{ env.SHA_OK }}" = "true" ]; then
            echo "✅ SHA matches (deployment complete)"
          else
            echo "⚠️  SHA may still be updating"
          fi
          if [ "${{ env.ENDPOINT_OK }}" = "true" ]; then
            echo "✅ /api/test/reset-mutual-smile returns 200"
            echo ""
            echo "🎉 DEPLOYMENT VERIFIED - ALL SYSTEMS GO"
          else
            echo "❌ /api/test/reset-mutual-smile failed"
            echo ""
            echo "⚠️  DEPLOYMENT INCOMPLETE OR FAILED"
          fi
          echo "=========================================="
