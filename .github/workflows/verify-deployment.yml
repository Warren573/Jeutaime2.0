name: Verify Deployment

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render Deploy
        run: |
          echo "Triggering Render deployment..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo ""
          echo "Deploy webhook sent. Waiting for Render to process..."
          sleep 15

      - name: Get latest commit SHA
        run: |
          LATEST_SHA=$(git rev-parse --short HEAD)
          echo "LATEST_SHA=$LATEST_SHA" >> $GITHUB_ENV
          echo "Expected SHA: $LATEST_SHA"

      - name: Wait for /api/health/version to respond
        run: |
          echo "Polling ${{ secrets.BACKEND_API_URL }}/api/health/version..."
          BACKEND_URL="${{ secrets.BACKEND_API_URL }}"

          for i in {1..40}; do
            echo "Attempt $i/40..."
            RESPONSE=$(curl -s -w "\n%{http_code}" "$BACKEND_URL/api/health/version")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Got 200 response"
              echo "HEALTH_RESPONSE=$BODY" >> $GITHUB_ENV
              break
            else
              echo "Got HTTP $HTTP_CODE, retrying in 5s..."
              sleep 5
            fi
          done

      - name: Verify SHA matches
        run: |
          if [ -z "${{ env.HEALTH_RESPONSE }}" ]; then
            echo "❌ FAILED: Could not get health response after 200 seconds"
            exit 1
          fi

          echo "Health response: ${{ env.HEALTH_RESPONSE }}"

          RENDER_SHA=$(echo '${{ env.HEALTH_RESPONSE }}' | grep -o '"sha":"[^"]*' | cut -d'"' -f4 | cut -c1-8)
          EXPECTED_SHA="${{ env.LATEST_SHA }}"

          echo "Expected SHA: $EXPECTED_SHA"
          echo "Render SHA:   $RENDER_SHA"

          if [ "$RENDER_SHA" = "$EXPECTED_SHA" ]; then
            echo "✅ SHA matches! Deployment complete."
          else
            echo "❌ FAILED: SHA mismatch. Render still on old version."
            exit 1
          fi

      - name: Test /api/test/reset-mutual-smile endpoint
        run: |
          echo "Testing endpoint: ${{ secrets.BACKEND_API_URL }}/api/test/reset-mutual-smile"
          BACKEND_URL="${{ secrets.BACKEND_API_URL }}"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$BACKEND_URL/api/test/reset-mutual-smile")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ FAILED: Expected HTTP 200, got $HTTP_CODE"
            exit 1
          fi

          if echo "$BODY" | grep -q '"status":"success"'; then
            echo "✅ Endpoint returned success"
          else
            echo "❌ FAILED: Response missing 'status:success'"
            exit 1
          fi

      - name: Success Summary
        run: |
          echo ""
          echo "╔════════════════════════════════════════╗"
          echo "║  ✅ DEPLOYMENT VERIFIED - ALL SYSTEMS  ║"
          echo "╠════════════════════════════════════════╣"
          echo "║  ✅ Render deploy triggered            ║"
          echo "║  ✅ /api/health/version responding     ║"
          echo "║  ✅ SHA matches (${{ env.LATEST_SHA }})    ║"
          echo "║  ✅ /api/test/reset-mutual-smile OK    ║"
          echo "╚════════════════════════════════════════╝"
          echo ""
