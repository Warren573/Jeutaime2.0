name: Economy frontend typecheck and web build

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/economy-frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck React Native and Expo Router
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Export iOS Android and Web bundles
        working-directory: frontend
        env:
          CI: '1'
        run: npx expo export --platform all
